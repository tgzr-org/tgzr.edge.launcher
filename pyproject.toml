[project]
name = "tgzr.edge.launcher"
dynamic = ["version"]
description = "TGZR launcher: builds a client's venv for an org, starts the client, waits until it is ready, then exits"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = [
    "nicegui>=3.19,<4",
    "pywebview[qt]>=5",  # --native: the launcher's page in a desktop window
    "pydantic-settings>=2.16",
    "tgzr.edge.home_manager>=0.102",  # build(on_event=...), uv-project venvs
    "tgzr.libs.package_management>=0.102",
]

[project.urls]
Homepage = "https://github.com/tgzr-org/tgzr.edge.launcher"
Repository = "https://github.com/tgzr-org/tgzr.edge.launcher.git"
Issues = "https://github.com/tgzr-org/tgzr.edge.launcher/issues"

[project.scripts]
"tgzr.edge.launcher" = "tgzr.edge.launcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.uv]
# Rebuild this package's metadata (its hatch-vcs version) after a commit or a tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"
# Until the repository has its first tag.
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/tgzr/edge/launcher/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tgzr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: builds client venvs with uv and runs clients as subprocesses",
]
